<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سفاري الأرقام مع فطومة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-weight:800;color:#5a3412;background:linear-gradient(#7fd6ff 0,#d6f4ff 55%,#b6e27a 55%,#6fbf4a 100%) fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#deco{position:fixed;bottom:0;left:0;right:0;font-size:clamp(34px,9vw,60px);display:flex;justify-content:space-between;padding:0 10px;pointer-events:none;opacity:.9;z-index:0}
#sun{position:fixed;top:8px;left:12px;font-size:54px;z-index:0}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 12px 90px;text-align:center}
#stars{font-size:26px;letter-spacing:4px}
h1{margin:6px 0;font-size:clamp(26px,7vw,38px);color:#d9480f;text-shadow:0 3px 0 #fff}
.t{font-size:clamp(20px,5.5vw,26px);margin:6px 0 12px;background:#fff9;border-radius:18px;padding:6px 14px;display:inline-block}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.btn{font:inherit;font-size:24px;border:0;border-radius:40px;padding:12px 30px;background:#ff8a1f;color:#fff;box-shadow:0 6px 0 #c2570a;cursor:pointer;margin:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2570a}
.btn.g{background:#3fae49;box-shadow:0 6px 0 #26762e}
.card,.slot,.chip,.it,.cell{background:#fff;border:4px solid #ffb84d;border-radius:22px;box-shadow:0 5px 0 #e09a2b;cursor:pointer;font:inherit}
.card{width:30%;min-width:96px;padding:8px 2px;color:#d9480f}
.card b{display:block;font-size:54px;line-height:1.1}
.card span{display:block;font-size:20px;line-height:1.2;min-height:48px}
.card small{display:block;font-size:18px;color:#5a3412}
.slot{width:30%;min-width:96px;min-height:104px;padding:6px 2px;font-size:24px;line-height:1.2;cursor:default}
.slot i{display:block;font-style:normal;font-size:40px;color:#d9480f;min-height:46px}
.chip{width:64px;height:64px;font-size:40px;color:#d9480f;touch-action:none;position:relative;z-index:5;display:flex;align-items:center;justify-content:center}
.chip.up{z-index:50}
.cn{position:relative;display:flex;justify-content:space-between;padding:0 14px}
.col{display:flex;flex-direction:column;gap:10px;z-index:2}
.it{width:130px;height:70px;font-size:24px;line-height:1.1;display:flex;align-items:center;justify-content:center;color:#5a3412}
.it.n{width:84px;font-size:46px;color:#d9480f}
.it.sel{background:#fff3bf;transform:scale(1.08)}
.it.ok{background:#d3f9d8;border-color:#3fae49;box-shadow:none}
#ln{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{aspect-ratio:1;font-size:clamp(36px,10vw,52px);color:#5a3412;position:relative}
.cell.ring::after{content:"";position:absolute;inset:-2px;border:6px solid #e03131;border-radius:50%;transform:rotate(-8deg) scale(1.08)}
.wr{width:100%;max-width:340px;touch-action:none;background:#fff;border:5px solid #ffb84d;border-radius:24px;display:block;margin:0 auto}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.25)}}
.fall{position:fixed;top:-40px;font-size:34px;z-index:99;pointer-events:none;animation:fl 2.2s linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:90px}
@media (prefers-reduced-motion:reduce){.fall{animation-duration:.01s}}
</style>
</head>
<body>
<div id="sun">☀️</div>
<div id="deco"><span>🌴</span><span>🐘</span><span>🦒</span><span>🦓</span><span>🌴</span></div>
<div id="app">
  <div id="stars">⭐⭐⭐⭐⭐</div>
  <div id="st"></div>
</div>
<script>
const N=[{c:'١',n:'واحد',e:'🦁',k:1},{c:'٢',n:'اثنان',e:'🐘',k:2},{c:'٣',n:'ثلاثة',e:'🦒',k:3},{c:'٤',n:'أربعة',e:'🦓',k:4},{c:'٥',n:'خمسة',e:'🐒',k:5},{c:'٦',n:'ستة',e:'🦜',k:6}];
const grp=l=>l.e.repeat(l.k);
const PR=['أحسنتِ يا فطومة!','برافو فطومة!','ممتازة!','رائعة يا عسل!','شاطرة يا فطومة!'];
const st=document.getElementById('st'),stars=document.getElementById('stars');
let ac=null,step=0,busy=false;
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const by=c=>N.find(x=>x.c==c);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.75;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function ding(){if(!ac)return;[660,880,1100].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.35)})}
function clap(){if(!ac)return;for(let i=0;i<26;i++){const t=ac.currentTime+i*.07+Math.random()*.05,b=ac.createBuffer(1,2200,ac.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1500+Math.random()*2500;g.gain.value=.5;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}}
function oops(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=220;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}
function confetti(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='fall';s.textContent=pick(['⭐','🎉','🌟','🎊','🍯']);s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.append(s);setTimeout(()=>s.remove(),3000)}}
function cheer(big,txt){ding();if(big)clap();confetti();say(txt||pick(PR))}
function bad(el){oops();el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');say('حاولي مرة أخرى')}
function go(i){step=i;busy=false;stars.textContent='⭐'.repeat(Math.min(i,5))+'☆'.repeat(Math.max(0,5-i));[start,learn,drag,connect,circle,write,end][i]()}
function nextLater(ms){if(busy)return;busy=true;setTimeout(()=>go(step+1),ms||1800)}

function start(){stars.textContent='☆☆☆☆☆';
st.innerHTML='<h1>سفاري الأرقام 🐘</h1><div class="t">مع فطومة العسل</div><div class="big">🚙🦒🦁</div><button class="btn" id="go">ابدأ المغامرة</button>';
document.getElementById('go').onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();say('مرحبا فطومة! هيا نتعلم الأرقام');setTimeout(()=>go(1),1800)}}

function learn(){let seen=new Set();st.innerHTML='<div class="t">المسي الرقم واسمعي اسمه 🔊</div><div class="row">'+N.map((l,i)=>`<button class="card" data-i="${i}"><b>${l.c}</b><span>${grp(l)}</span><small>${l.n}</small></button>`).join('')+'</div><div id="nx"></div>';
st.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const l=N[b.dataset.i];b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),500);say(l.n+'... '+l.n);ding();seen.add(l.c);if(seen.size==6){const nx=document.getElementById('nx');nx.innerHTML='<button class="btn g" id="n">التالي ◀</button>';document.getElementById('n').onclick=()=>go(2)}})}

function drag(){let done=0;st.innerHTML='<div class="t">اسحبي الرقم إلى الحيوانات 🐾</div><div class="row">'+N.map(l=>`<div class="slot" data-c="${l.c}">${grp(l)}<i></i></div>`).join('')+'</div><div class="row" style="margin-top:22px">'+sh(N).map(l=>`<div class="chip" data-c="${l.c}">${l.c}</div>`).join('')+'</div>';
st.querySelectorAll('.chip').forEach(ch=>{let sx,sy,on=false;
ch.onpointerdown=e=>{on=true;sx=e.clientX;sy=e.clientY;ch.setPointerCapture(e.pointerId);ch.classList.add('up');say(by(ch.dataset.c).n)};
ch.onpointermove=e=>{if(on)ch.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.25)`};
ch.onpointerup=e=>{if(!on)return;on=false;ch.style.visibility='hidden';const t=document.elementFromPoint(e.clientX,e.clientY);ch.style.visibility='';ch.classList.remove('up');
const s=t&&t.closest('.slot');
if(s&&s.dataset.c==ch.dataset.c&&!s.classList.contains('ok')){s.classList.add('ok','pop');s.querySelector('i').textContent=ch.textContent;ch.remove();const l=by(s.dataset.c);cheer(false,l.n+'. '+pick(PR));if(++done==6){cheer(true);nextLater(2200)}}
else{ch.style.transform='';bad(s||ch)}}})}

function connect(){let sel=null,n=0;const an=sh(N);
st.innerHTML='<div class="t">وصّلي الرقم بالحيوانات ✏️</div><div class="cn"><svg id="ln"></svg><div class="col">'+N.map(l=>`<button class="it n" data-c="${l.c}" data-s="a">${l.c}</button>`).join('')+'</div><div class="col">'+an.map(l=>`<button class="it" data-c="${l.c}" data-s="b">${grp(l)}</button>`).join('')+'</div></div>';
const cn=st.querySelector('.cn'),svg=document.getElementById('ln');
st.querySelectorAll('.it').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;
if(b.dataset.s=='a')say(by(b.dataset.c).n);
if(!sel||sel.dataset.s==b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
if(sel.dataset.c==b.dataset.c){const r=cn.getBoundingClientRect(),a=sel.getBoundingClientRect(),c=b.getBoundingClientRect();
const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',a.left+a.width/2-r.left);ln.setAttribute('y1',a.top+a.height/2-r.top);ln.setAttribute('x2',c.left+c.width/2-r.left);ln.setAttribute('y2',c.top+c.height/2-r.top);ln.setAttribute('stroke','#3fae49');ln.setAttribute('stroke-width','8');ln.setAttribute('stroke-linecap','round');svg.append(ln);
sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel=null;cheer(false);if(++n==6){cheer(true);nextLater(2200)}}
else{sel.classList.remove('sel');sel=null;bad(b)}})}

function circle(k){k=k||0;const T=['٣','٥'];if(k>=2)return go(5);const t=T[k],tn=by(t).n,others=N.filter(x=>x.c!=t).map(x=>x.c);
let cells=[t,t,t,t];for(let i=0;i<8;i++)cells.push(pick(others));cells=sh(cells);let f=0;
st.innerHTML=`<div class="t">دوّري كل رقم ${t} (${tn}) ⭕</div><div class="grid">`+cells.map(c=>`<button class="cell" data-c="${c}">${c}</button>`).join('')+'</div>';
say('دوّري كل رقم '+tn);
st.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{if(b.classList.contains('ring'))return;
if(b.dataset.c==t){b.classList.add('ring','pop');ding();say(tn);if(++f==4){cheer(true);setTimeout(()=>{busy=false;circle(k+1)},2000)}}else bad(b)})}

function write(i){i=i||0;if(i>=6)return go(6);const l=N[i];
st.innerHTML=`<div class="t">اكتبي الرقم ${l.c} (${l.n}) على الخط ✍️</div><canvas class="wr" id="cv" width="340" height="260"></canvas><div class="row"><button class="btn" id="cl">مسح 🧽</button><button class="btn g" id="ok">تم ✓</button></div>`;
const cv=document.getElementById('cv'),x=cv.getContext('2d');let drawn=0,pen=false;
function bg(){x.clearRect(0,0,340,260);x.strokeStyle='#8ecae6';x.lineWidth=3;x.setLineDash([10,8]);[70,150,215].forEach(y=>{x.beginPath();x.moveTo(10,y);x.lineTo(330,y);x.stroke()});x.setLineDash([]);x.fillStyle='#e3e3e3';x.font='800 190px Cairo,Arial';x.textAlign='center';x.textBaseline='alphabetic';x.fillText(l.c,170,190);drawn=0}
bg();setTimeout(()=>say(l.n),300);
const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*340/r.width,(e.clientY-r.top)*260/r.height]};
cv.onpointerdown=e=>{pen=true;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.strokeStyle='#ff7a00';x.lineWidth=14;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
cv.onpointermove=e=>{if(!pen)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();drawn++};
cv.onpointerup=()=>pen=false;
document.getElementById('cl').onclick=bg;
document.getElementById('ok').onclick=()=>{if(drawn<5){say('اكتبي الرقم بإصبعك');return}cheer(true);setTimeout(()=>write(i+1),2000)}}

function end(){stars.textContent='⭐⭐⭐⭐⭐';st.innerHTML='<h1>أحسنتِ يا فطومة! 🎉</h1><div class="big">🏆🐘</div><div class="t">أنتِ بطلة السفاري!<br>١ ٢ ٣ ٤ ٥ ٦</div><br><button class="btn" id="re">نلعب مرة أخرى 🔁</button>';
cheer(true,'أحسنتِ يا فطومة! أنتِ بطلة السفاري');setTimeout(clap,1500);document.getElementById('re').onclick=()=>go(1)}
start();
</script>
</body>
</html>
